<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MayWiFin 🎵</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons (Material Symbols Rounded) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/theme-aether.css">
</head>
<body>

    <!-- Dynamic Album Blur Backdrop -->
    <div id="app-backdrop" class="app-backdrop"></div>
    <div id="backdrop-overlay" class="backdrop-overlay"></div>

    <!-- Top progress bar for route transitions (no full-page loading flash) -->
    <div id="route-progress" class="route-progress"></div>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>MayWiFin</h2>
        </div>
        <ul class="nav-links">
            <li><a href="#/" class="nav-btn active" data-route="/"><span class="material-symbols-rounded">home</span> Home</a></li>
            <li><a href="#/library" class="nav-btn" data-route="/library"><span class="material-symbols-rounded">library_music</span> Library</a></li>
            <li><a href="#/playlists" class="nav-btn" data-route="/playlists"><span class="material-symbols-rounded">queue_music</span> Playlists</a></li>
            <li><a href="#/radio" class="nav-btn" data-route="/radio"><span class="material-symbols-rounded">radio</span> Radio</a></li>
            <li class="spacer"></li>
            <li id="nav-admin" style="display: none;"><a href="#/admin" class="nav-btn" data-route="/admin"><span class="material-symbols-rounded">admin_panel_settings</span> Admin</a></li>
            <li><a href="#/settings" class="nav-btn" data-route="/settings"><span class="material-symbols-rounded">settings</span> Settings</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
        <!-- SPA Pages will be injected here -->
        <div class="page-loader">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Right Panel (Lyrics / Queue) -->
    <aside id="right-panel" class="right-panel hidden">
        <div class="panel-header">
            <h3 id="panel-title">Paroles</h3>
            <button id="close-panel" class="icon-btn"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div id="panel-content" class="panel-content">
            <!-- Lyrics injected here -->
        </div>
    </aside>

    <!-- Bottom Player Bar -->
    <footer class="player-bar">
        <!-- Current Track Info -->
        <div class="now-playing">
            <img id="player-cover" src="/assets/default-cover.png" alt="Cover" class="cover-art">
            <div class="track-details">
                <span id="player-title" class="title">Aucun titre en lecture</span>
                <span id="player-artist" class="artist">...</span>
            </div>
            <button id="btn-like" class="icon-btn xs-hidden"><span class="material-symbols-rounded">favorite_border</span></button>
        </div>

        <!-- Central Controls -->
        <div class="player-controls">
            <div class="control-buttons">
                <button id="btn-shuffle" class="icon-btn small xs-hidden"><span class="material-symbols-rounded">shuffle</span></button>
                <button id="btn-prev" class="icon-btn"><span class="material-symbols-rounded">skip_previous</span></button>
                <button id="btn-play-pause" class="icon-btn play-btn"><span class="material-symbols-rounded" id="play-icon">play_arrow</span></button>
                <button id="btn-next" class="icon-btn"><span class="material-symbols-rounded">skip_next</span></button>
                <button id="btn-repeat" class="icon-btn small xs-hidden"><span class="material-symbols-rounded">repeat</span></button>
            </div>
            <div class="progress-container xs-hidden" id="progress-container">
                <span id="time-current" class="time">0:00</span>
                <div class="seek-wrap is-disabled">
                    <div class="waveform-hover" id="waveform-hover" aria-hidden="true"></div>
                    <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100" step="any" aria-label="Position de lecture" disabled>
                    <div class="seek-tooltip" aria-hidden="true">0:00</div>
                </div>
                <span id="time-total" class="time">0:00</span>
            </div>
        </div>

        <!-- Right Side Controls -->
        <div class="extra-controls xs-hidden">
            <!-- Playback speed lives only in the Effets popup now (btn-fx below) -->

            <!-- Quality Selector (custom dropdown) -->
            <div class="quality-menu" id="quality-menu">
                <button type="button" id="quality-menu-btn" class="quality-menu-btn" title="Qualité audio">
                    <svg id="quality-atmos-icon" class="quality-atmos-icon" viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg"><title>Dolby Atmos</title><path d="M24,20.352V3.648H0v16.704H24z M18.433,5.806h2.736v12.387h-2.736c-2.839,0-5.214-2.767-5.214-6.194S15.594,5.806,18.433,5.806z M2.831,5.806h2.736c2.839,0,5.214,2.767,5.214,6.194s-2.374,6.194-5.214,6.194H2.831V5.806z"></path></svg>
                    <span id="quality-icon" class="material-symbols-rounded">high_quality</span>
                </button>
                <div class="quality-menu-panel hidden" id="quality-menu-panel">
                    <div class="quality-menu-header">Qualité audio</div>
                    <button type="button" class="quality-option" data-value="hires">
                        <span class="quality-option-label">Hi-Res Lossless</span>
                        <span class="quality-option-check material-symbols-rounded">check</span>
                    </button>
                    <button type="button" class="quality-option" data-value="lossless">
                        <svg class="quality-option-atmos-badge hidden" viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg"><title>Dolby Atmos</title><path d="M24,20.352V3.648H0v16.704H24z M18.433,5.806h2.736v12.387h-2.736c-2.839,0-5.214-2.767-5.214-6.194S15.594,5.806,18.433,5.806z M2.831,5.806h2.736c2.839,0,5.214,2.767,5.214,6.194s-2.374,6.194-5.214,6.194H2.831V5.806z"></path></svg>
                        <span class="quality-option-label" data-normal-label="Lossless" data-atmos-label="Dolby Atmos">Lossless</span>
                        <span class="quality-option-check material-symbols-rounded">check</span>
                    </button>
                    <button type="button" class="quality-option" data-value="320">
                        <span class="quality-option-label">MP3 320 kbps</span>
                        <span class="quality-option-check material-symbols-rounded">check</span>
                    </button>
                    <button type="button" class="quality-option" data-value="128">
                        <span class="quality-option-label">MP3 128 kbps</span>
                        <span class="quality-option-check material-symbols-rounded">check</span>
                    </button>
                    <div id="quality-hint" class="quality-menu-hint hidden"></div>
                </div>
            </div>

            <button id="btn-fx" class="icon-btn" title="Effets (Slowed/Reverb)"><span class="material-symbols-rounded">graphic_eq</span></button>
            <button id="btn-lyrics" class="icon-btn" title="Paroles"><span class="material-symbols-rounded">lyrics</span></button>
            <button id="btn-queue" class="icon-btn" title="File d'attente"><span class="material-symbols-rounded">list</span></button>

            <!-- Volume Control -->
            <div class="volume-container">
                <span class="material-symbols-rounded" id="volume-icon">volume_up</span>
                <input type="range" id="volume-bar" class="volume-bar" value="100" min="0" max="100">
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <!-- Entry point -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
